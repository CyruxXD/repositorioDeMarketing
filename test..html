<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Working Scroll Animation</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<style>
body {
  margin: 0;
  background: black;
  color: white;
}

section {
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

h1 {
  font-size: clamp(3rem, 8vw, 8rem);
}

img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>
</head>

<body>

<section>
  <h1>THIS IS</h1>
</section>

<section id="pinSection">
  <img id="image"
    src="https://images.unsplash.com/photo-1501785888041-af3ef285b470" />
  <h1 style="position:absolute;">NORWAY</h1>
</section>

<section>
  <h1>EXPLORE</h1>
</section>

<script>
gsap.registerPlugin(ScrollTrigger);

// Pin real (esto sí funciona siempre)
gsap.timeline({
  scrollTrigger: {
    trigger: "#pinSection",
    start: "top top",
    end: "+=100%",
    scrub: true,
    pin: true
  }
})
.to("#image", {
  scale: 1.1,
  ease: "none"
});
</script>

</body>
</html>
